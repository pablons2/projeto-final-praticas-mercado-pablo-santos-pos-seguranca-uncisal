# Frontend (SPA) + proxy reverso da API — origem única.
#
# Servir o React e a API sob o MESMO host/porta elimina CORS e faz o
# cookie de sessão (SameSite=Strict, HttpOnly) funcionar sem exceções.
# Espelha a topologia de produção descrita em docs/plano.md §1 (Nginx na
# frente da aplicação).

server {
    listen       80;
    server_name  _;

    # Não revela a versão do Nginx nas respostas/erros.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança para o conteúdo HTML servido aqui. A API
    # tem os seus próprios (middleware/security_headers.go).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # Healthcheck local do container.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Tudo sob /api vai para o backend. O backend enxerga o IP real do
    # cliente via X-Forwarded-For (rate limiting) quando TRUST_PROXY=true.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Assets com hash no nome podem ter cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
