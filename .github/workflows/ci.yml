# CI — Integração Contínua
#
# Roda em todo push e em todo pull request: audita e testa o backend Go
# e builda o frontend. É o portão de qualidade — o workflow de CD
# (deploy.yml) só implanta depois que este passa na branch `main`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — vet + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Verificar formatação (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build de sanidade
        run: go build -o /dev/null ./cmd/api

  frontend:
    name: Frontend — lint + build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  e2e:
    name: E2E — Playwright (stack Docker)
    # Fixado no 24.04: o ubuntu-latest já é 26.04, sem suporte do Playwright 1.56
    # para instalar Chromium/ffmpeg. Trocar só com versão do Playwright que suporte.
    runs-on: ubuntu-24.04
    # Só roda se backend e frontend passarem. O CD espera esta CI inteira,
    # então um smoke test vermelho também bloqueia o deploy.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack (make up)
        run: make up

      - name: Aguardar a aplicação responder
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "OK - aplicação respondendo"
              exit 0
            fi
            echo "... tentativa $i, aguardando"
            sleep 2
          done
          echo "FALHA - aplicação não subiu"
          docker compose logs --tail=80
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependências e Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium ffmpeg

      - name: Rodar smoke test (gera vídeo e relatório)
        working-directory: e2e
        run: npm test

      - name: Anexar gravação e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gravacao-e-relatorio
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Derrubar a stack
        if: always()
        run: make down
