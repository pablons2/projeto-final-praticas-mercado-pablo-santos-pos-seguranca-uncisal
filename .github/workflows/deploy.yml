# CI/CD — IncidentTrack
#
# Esteira exigida pelo escopo (Eixos 1+2+3): a cada `git push` na branch
# `main`, o GitHub Actions testa o backend, builda o frontend e, se tudo
# passar, implanta na VM de produção por SSH.
#
# NENHUMA credencial fica no arquivo. Tudo vem de GitHub Secrets
# (Settings → Secrets and variables → Actions):
#
#   SSH_PRIVATE_KEY   chave privada SSH com acesso à VM (formato OpenSSH)
#   SSH_KNOWN_HOSTS   saída de `ssh-keyscan -H <IP_DA_VM>` (fixa o host)
#   SERVER_HOST       IP público da VM
#   SERVER_USER       usuário SSH na VM (ex.: ubuntu, debian)
#   DEPLOY_PATH       caminho do repositório clonado na VM (ex.: /home/ubuntu/incidenttrack)
#   JWT_SECRET        segredo HMAC dos JWT em produção (openssl rand -base64 48)
#   APP_PORT          porta pública da aplicação na VM (ex.: 8080)
#   APP_ORIGIN        URL pela qual o navegador acessa a app (ex.: https://<IP>)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  test-backend:
    name: Backend — vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build (sanity)
        run: go build -o /dev/null ./cmd/api

  # ---------------------------------------------------------------
  build-frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  deploy:
    name: Deploy (SSH → docker compose)
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    # Só implanta em push direto na main — nunca em pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Implantar na VM
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
            JWT_SECRET="${JWT_SECRET}" \
            APP_PORT="${APP_PORT}" \
            APP_ORIGIN="${APP_ORIGIN}" \
            GIT_SHA="${{ github.sha }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          echo "→ Atualizando código para ${GIT_SHA}"
          git fetch --prune origin main
          git reset --hard "${GIT_SHA}"

          echo "→ Gerando .env de produção (fora do versionamento)"
          umask 077
          cat > .env <<ENV
          APP_ENV=production
          COOKIE_SECURE=true
          JWT_SECRET=${JWT_SECRET}
          APP_PORT=${APP_PORT}
          APP_ORIGIN=${APP_ORIGIN}
          ENV

          echo "→ Subindo a stack"
          docker compose pull --quiet || true
          docker compose up -d --build

          echo "→ Limpando imagens órfãs"
          docker image prune -f

          echo "→ Estado dos serviços"
          docker compose ps
          REMOTE

      - name: Healthcheck público
        env:
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${APP_ORIGIN}/healthz" >/dev/null 2>&1 \
               || curl -fsSk --max-time 10 "${APP_ORIGIN}/healthz" >/dev/null 2>&1; then
              echo "✓ Aplicação respondendo em ${APP_ORIGIN}/healthz"
              exit 0
            fi
            echo "… tentativa $i falhou, aguardando"
            sleep 6
          done
          echo "✗ Aplicação não respondeu ao healthcheck"
          exit 1
