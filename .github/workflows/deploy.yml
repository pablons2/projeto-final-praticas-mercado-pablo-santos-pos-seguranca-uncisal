# CD — Entrega Contínua (deploy em produção)
#
# Esteira exigida pelo escopo (Eixos 1+2+3): a cada `git push` na branch
# `main`, depois que o workflow "CI" passa, o código é implantado na VM
# de produção por SSH.
#
# Gatilho: `workflow_run` — este workflow só roda após o "CI" concluir
# com sucesso na `main` (nunca implanta com teste vermelho). Também pode
# ser disparado manualmente (`workflow_dispatch`).
#
# NENHUMA credencial fica no arquivo. Tudo vem de GitHub Secrets
# (Settings -> Secrets and variables -> Actions):
#
#   SSH_PRIVATE_KEY   chave privada SSH com acesso à VM (formato OpenSSH)
#   SSH_KNOWN_HOSTS   saída de `ssh-keyscan -H <IP_DA_VM>` (fixa o host)
#   SERVER_HOST       IP público da VM
#   SERVER_USER       usuário SSH na VM (ex.: ubuntu, debian)
#   DEPLOY_PATH       caminho do repositório clonado na VM (ex.: /home/ubuntu/incidenttrack)
#   JWT_SECRET        segredo HMAC dos JWT em produção (openssl rand -base64 48)
#   APP_PORT          porta pública da aplicação na VM (ex.: 8080)
#   APP_ORIGIN        URL pela qual o navegador acessa a app (ex.: https://<IP>)
#
# Setup único da VM: clonar o repo em DEPLOY_PATH com `origin` = URL
# pública do GitHub, instalar Docker Engine + Compose v2 (>= 2.24) e
# fazer o bootstrap TLS (Nginx/Certbot) do guia deploy/README.md §9.
# Depois disso, cada deploy sobe a stack com `docker-compose.yml` +
# `docker-compose.prod.yml` (proxy TLS + PQC); enquanto o certificado
# não existir, sobe só a base.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (SSH -> docker compose)
    runs-on: ubuntu-latest
    # workflow_dispatch: sempre. workflow_run: só se a CI passou.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    env:
      # SHA exatamente testado pela CI (ou HEAD da main no disparo manual).
      GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Implantar na VM
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
            JWT_SECRET="${JWT_SECRET}" \
            APP_PORT="${APP_PORT}" \
            APP_ORIGIN="${APP_ORIGIN}" \
            GIT_SHA="${GIT_SHA}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          echo "-> Atualizando código para ${GIT_SHA}"
          git fetch --prune origin main
          git reset --hard "${GIT_SHA}"

          # Host de APP_ORIGIN (ex.: https://203.0.113.10 -> 203.0.113.10).
          # É o nome da lineage do certbot e o server_name do proxy TLS.
          CERT_NAME="$(printf '%s' "${APP_ORIGIN}" | sed -E 's#^https?://##; s#[:/].*$##')"

          echo "-> Gerando .env de produção (fora do versionamento)"
          umask 077
          cat > .env <<ENV
          APP_ENV=production
          COOKIE_SECURE=true
          JWT_SECRET=${JWT_SECRET}
          APP_PORT=${APP_PORT}
          APP_ORIGIN=${APP_ORIGIN}
          CERT_NAME=${CERT_NAME}
          ENV

          # O override de produção (proxy TLS + PQC) só entra quando o
          # certificado já existe na VM. Sem ele, sobe só a stack base —
          # rode o bootstrap TLS do guia (deploy/README.md §9).
          FILES="-f docker-compose.yml"
          if [ -f "/etc/letsencrypt/live/${CERT_NAME}/fullchain.pem" ]; then
            FILES="${FILES} -f docker-compose.prod.yml"
            echo "-> Certificado ${CERT_NAME} encontrado: subindo com proxy TLS"
          else
            echo "-> AVISO: /etc/letsencrypt/live/${CERT_NAME} ausente — subindo SEM proxy TLS"
          fi

          echo "-> Subindo a stack"
          # shellcheck disable=SC2086
          docker compose ${FILES} pull --quiet || true
          # shellcheck disable=SC2086
          docker compose ${FILES} up -d --build --remove-orphans

          echo "-> Limpando imagens órfãs"
          docker image prune -f

          echo "-> Estado dos serviços"
          # shellcheck disable=SC2086
          docker compose ${FILES} ps
          REMOTE

      - name: Healthcheck público
        env:
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS  --max-time 10 "${APP_ORIGIN}/healthz" >/dev/null 2>&1 \
               || curl -fsSk --max-time 10 "${APP_ORIGIN}/healthz" >/dev/null 2>&1; then
              echo "OK - aplicação respondendo em ${APP_ORIGIN}/healthz"
              exit 0
            fi
            echo "... tentativa $i falhou, aguardando"
            sleep 6
          done
          echo "FALHA - aplicação não respondeu ao healthcheck"
          exit 1
